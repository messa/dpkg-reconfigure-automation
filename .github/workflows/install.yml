name: Install Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with pip
        run: pip install .

      - name: Verify installation
        run: |
          # Check that the package is installed
          pip show dpkg-reconfigure-automation
          # Check that the entry point script is available
          which dpkg-reconfigure-automation-editor
          # Run the script with --help to verify it works
          dpkg-reconfigure-automation-editor --help

  install-from-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: pip install build

      - name: Build wheel
        run: python -m build

      - name: Install from wheel
        run: pip install dist/*.whl

      - name: Verify installation
        run: |
          pip show dpkg-reconfigure-automation
          dpkg-reconfigure-automation-editor --help
