[project]
name = "dpkg-reconfigure-automation"
version = "0.1.0"
description = "Automate dpkg-reconfigure by modifying debconf editor files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Petr Messner", email = "petr.messner+github@gmail.com" }
]
dependencies = []

[project.urls]
Homepage = "https://github.com/messa/dpkg-reconfigure-automation"
Repository = "https://github.com/messa/dpkg-reconfigure-automation.git"
Issues = "https://github.com/messa/dpkg-reconfigure-automation/issues"

[project.scripts]
dpkg-reconfigure-automation-editor = "dpkg_reconfigure_automation_editor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["dpkg_reconfigure_automation_editor.py"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=7.0",
]
